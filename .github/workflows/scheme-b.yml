name: Scheme B - the package manager drives the bootstrap

# Scheme B: the Okra package manager is in charge of the whole system.
#
# What this workflow proves, in order:
#
#   1. the cross toolchain builds a userland out of the 70 bootstrapped packages
#   2. OkraPM (lunar, opsis, the oaa tools) is compiled by that userland's own
#      g++, and packed by its own opsis
#   3. the result becomes a Lunar software source - a repository, in the format
#      lunar syncs, including the app.glibc package that was missing
#   4. lunar, running on the host, installs that entire userland into an empty
#      directory, in dependency order, as one transaction
#   5. the package manager that the transaction installed then runs inside the
#      chroot and installs packages from the same repository, using only what
#      the transaction put there
#
# Step 5 is what makes it scheme B rather than scheme A. The package manager is
# not compiled after the fact into a finished system: it is a package in the
# repository, it is built by the system it belongs to, and it manages that
# system from the inside.
#
# The seed is still Ubuntu's own gcc, which built the cross toolchain once.
# Everything after that comes from the cross toolchain.
on:
  workflow_dispatch:
    inputs:
      okrapm_ref:
        description: 'okrapm revision to build (branch, tag or commit)'
        required: false
        default: 'main'
      publish:
        description: 'Publish the repository and the package manager as a release'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  OKRA_TOOLCHAIN: /opt/okra-toolchain
  OKRA_TARGET_TRIPLE: x86_64-okra-linux-gnu
  OKRA_TOOLCHAIN_SOURCE_REPOSITORY: ylh440104/okra-oaa-packages-x86_64
  OKRA_PACKAGES_SOURCE_REPOSITORY: ylh440104/okra-oaa-packages-x86_64

jobs:
  scheme-b:
    runs-on: ubuntu-24.04
    # The native rebuilds are the long part: binutils and gcc once, then
    # libxcrypt and glibc again, at four jobs each, on top of everything the
    # cross build did.
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install what the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cmake \
            tar xz-utils zstd gzip bzip2 lzip file rsync python3 wget \
            curl ca-certificates git unzip

      - name: Fetch the cross toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Downloading the published artifact takes a minute or two. Building
          # the toolchain takes half an hour, so it is never rebuilt here.
          ./scripts/fetch-toolchain.sh

      - name: Fetch the oaa toolkit
        run: |
          set -euo pipefail
          # make-glibc-package.sh packs the synthesized glibc package with
          # oaa-build from the okrapm project, and the verification below builds
          # lunar from the same checkout.
          git clone -q --depth 1 --branch "${{ github.event.inputs.okrapm_ref }}" \
            https://github.com/OkraLinux/okrapm.git vendor/okrapm
          ls vendor/okrapm/oaatools | head -5
          # The host lunar does the first install, so it needs the same fix the
          # in-userland build applies: without it, installing mangles every
          # package whose libraries are a chain of symlinks.
          ./scripts/patch-okrapm.sh vendor/okrapm

      - name: Fetch the recipes the packages were built from
        run: |
          set -euo pipefail
          # The recipes and the build script are what produced the cross built
          # packages. The rebuild inside the userland uses them unchanged, so
          # the only thing that differs between the two builds is the compiler.
          git clone -q --depth 1 --branch "${OKRA_PACKAGES_REF:-main}" \
            "https://github.com/$OKRA_PACKAGES_SOURCE_REPOSITORY.git" \
            "$RUNNER_TEMP/okra-packages-repo"
          ls "$RUNNER_TEMP/okra-packages-repo/packages" | wc -l

      - name: Fetch the bootstrapped packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/okra-packages"
          ./scripts/fetch-packages.sh "$RUNNER_TEMP/okra-packages"

      - name: Assemble the userland
        run: |
          set -euo pipefail
          sudo mkdir -p "$RUNNER_TEMP/okra-rootfs"
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/okra-rootfs"
          ./scripts/assemble-userland.sh \
            "$RUNNER_TEMP/okra-rootfs" \
            "$RUNNER_TEMP/okra-packages"

      - name: Rebuild the toolchain inside the userland
        env:
          OKRA_JOBS: '4'
        run: |
          set -euo pipefail
          # The step that makes this a bootstrap rather than a cross build. The
          # userland is entered and binutils and gcc are rebuilt by the compiler
          # already inside it, so the toolchain stops being something that lives
          # on the runner.
          #
          # It takes a while: gcc alone is tens of minutes.
          # The build output is enormous and would push the job log past the
          # size GitHub keeps, which silently drops the output of every later
          # step. It goes to a file, a summary is printed, and the file is
          # uploaded with the other logs.
          sudo -E ./scripts/rebuild-native.sh "$RUNNER_TEMP/okra-rootfs" \
            > "$RUNNER_TEMP/rebuild-native.log" 2>&1 || {
              tail -60 "$RUNNER_TEMP/rebuild-native.log" >&2
              exit 1
            }
          grep -E '^(==|ok |FAIL|!!)' "$RUNNER_TEMP/rebuild-native.log" | tail -25
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/okra-rootfs"

      - name: Rebuild the C library inside the userland
        env:
          OKRA_JOBS: '4'
        run: |
          set -euo pipefail
          # glibc is the last thing that makes the userland depend on the cross
          # toolchain: every binary links against it. It is rebuilt with the
          # compiler the userland built, and libxcrypt comes first because perl
          # needs it and glibc's build calls perl.
          sudo -E ./scripts/rebuild-libc.sh "$RUNNER_TEMP/okra-rootfs" \
            > "$RUNNER_TEMP/rebuild-libc.log" 2>&1 || {
              tail -60 "$RUNNER_TEMP/rebuild-libc.log" >&2
              exit 1
            }
          grep -E '^(==|ok |FAIL|!!)' "$RUNNER_TEMP/rebuild-libc.log" | tail -25
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/okra-rootfs"

      - name: Compile the package manager inside the userland
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OKRA_OKRAPM_REF: ${{ github.event.inputs.okrapm_ref }}
        run: |
          set -euo pipefail
          sudo -E ./scripts/build-okrapm.sh \
            "$RUNNER_TEMP/okra-rootfs" \
            "$RUNNER_TEMP/okra-okrapm" \
            > "$RUNNER_TEMP/build-okrapm.log" 2>&1 || {
              tail -60 "$RUNNER_TEMP/build-okrapm.log" >&2
              exit 1
            }
          grep -E '^(==|ok |FAIL|!!)' "$RUNNER_TEMP/build-okrapm.log" | tail -15
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/okra-okrapm"

      - name: Build the software source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OKRA_ARTIFACTS: ${{ runner.temp }}/okra-okrapm/Okra.okrapm.oaa
        run: |
          set -euo pipefail
          ./scripts/publish-repo.sh > "$RUNNER_TEMP/publish-repo.log" 2>&1 || {
            tail -60 "$RUNNER_TEMP/publish-repo.log" >&2
            exit 1
          }
          grep -E '^(==|ok |FAIL|!!)' "$RUNNER_TEMP/publish-repo.log" | tail -20

      - name: Rebuild the userland packages inside the userland
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OKRA_JOBS: '4'
          OKRA_OKRAPM_ARCHIVE: ${{ runner.temp }}/okra-okrapm/Okra.okrapm.oaa
        run: |
          set -euo pipefail
          # The rest of the userland is still cross compiled. These are rebuilt
          # from their own sources by the compiler the system built, inside the
          # system, using the same recipes that produced the cross built ones.
          #
          # The userland's curl has no TLS, so the sources are fetched here and
          # handed to the build as file:// URLs; the recipe's sha256 still has
          # to match, which is what keeps that honest.
          #
          # meson and ninja are not packages in this system, so iputils and
          # systemd cannot be rebuilt here. They are left out and named in the
          # log rather than failing the run.
          sudo -E env OKRA_SKIP='iputils systemd' \
            ./scripts/rebuild-packages.sh \
            "$RUNNER_TEMP/okra-rootfs" \
            "$RUNNER_TEMP/okra-packages-repo/packages" \
            ./repo \
            "$RUNNER_TEMP/okra-rebuilt" \
            > "$RUNNER_TEMP/rebuild-packages.log" 2>&1 || {
              tail -120 "$RUNNER_TEMP/rebuild-packages.log" >&2
              exit 1
            }
          grep -E '^(==|ok |FAIL|!!|[a-z0-9_-]+: )' "$RUNNER_TEMP/rebuild-packages.log" | tail -40
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/okra-rootfs" "$RUNNER_TEMP/okra-rebuilt"

      - name: Pack the toolchain the system built for itself
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OKRA_REBUILT_DIRECTORY: ${{ runner.temp }}/okra-rebuilt
        run: |
          set -euo pipefail
          # The rebuilds replaced binutils, gcc and glibc in the tree without
          # telling the package manager, so the database still records the cross
          # built archives. Repacking the toolchain from the tree is the step the
          # bootstrap document calls the completion marker, and it is also what
          # makes the repository describe what the system actually runs on.
          ./scripts/repack-native-toolchain.sh \
            "$RUNNER_TEMP/okra-rootfs" \
            "$RUNNER_TEMP/okra-packages" \
            ./repo \
            "$RUNNER_TEMP/okra-native"

      - name: Build the host lunar for the verification
        run: |
          set -euo pipefail
          # The same checkout the oaa toolkit came from: this lunar runs on the
          # host and does the first install, before there is a lunar inside the
          # userland to do it.
          cmake -S vendor/okrapm -B "$RUNNER_TEMP/okrapm-build" \
            -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$RUNNER_TEMP/okrapm-build" -j4 --target lunar >/dev/null
          mkdir -p "$RUNNER_TEMP/host-lunar"
          cp "$RUNNER_TEMP/okrapm-build/src/lunar/lunar" "$RUNNER_TEMP/host-lunar/lunar"
          "$RUNNER_TEMP/host-lunar/lunar" help | head -3

      - name: Prove the package manager manages the system it was built in
        run: |
          set -euo pipefail
          # chroot and mount need root, so the whole check runs under sudo
          # rather than only the parts that enter the tree. Without it the
          # install still passes and then the chroot is refused.
          sudo -E ./scripts/verify-scheme-b.sh ./repo "$RUNNER_TEMP/host-lunar/lunar"


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okra-scheme-b-logs
          # The build logs are the only record of what each step did, and the
          # job log itself is truncated by GitHub once it grows past a few
          # megabytes, which silently drops the output of the later steps.
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/okra-rebuilt/logs/*.log
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: okra-scheme-b-repository
          path: |
            repo/index.yaml
            repo/artifacts/Okra.okrapm.oaa
          if-no-files-found: error
          retention-days: 14

      - name: Publish the repository and the package manager
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          Tag="okra-repo"
          Notes="The OkraPM software source produced by scheme B: the whole repository, index and archives together, where every package is the one the system built for itself.\n\nThe toolchain, the C library and the seventy userland packages were all compiled inside the system by the compiler the system produced, from the recipes that built them the first time. Nothing here is cross compiled any more.\n\nRunning the workflow reproduces this from scratch."
          gh release view "$Tag" >/dev/null 2>&1 || gh release create "$Tag" \
            --title "Okra software source" \
            --notes "$(printf '%b' "$Notes")"
          # The whole repository goes up, not a subset: after the rebuild every archive
          # in it is the one the system produced, so leaving any of them behind
          # would mean the published repository does not match its own index.
          mapfile -t Files < <(find repo -maxdepth 2 -type f \
            \( -name 'index.yaml' -o -name '*.oaa' -o -name '*.oaa.sha256' \) | sort)
          echo "uploading ${#Files[@]} files"
          printf '%s\n' "${Files[@]}" | head -12
          echo "..."
          du -ch "${Files[@]}" | tail -1
          [ "${#Files[@]}" -ge 60 ] || { echo "the repository looks incomplete" >&2; exit 1; }
          gh release upload "$Tag" "${Files[@]}" --clobber
          gh release view "$Tag" --json assets --jq '.assets | length'