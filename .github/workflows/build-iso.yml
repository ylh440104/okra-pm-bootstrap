name: Build a bootable ISO

# The userland comes from the repository the bootstrap published, so the ISO
# carries exactly what scheme-b produced. The kernel comes from the okra-userland
# release, which is the tree the LiveCD pipeline has always used.
#
# The three pieces are:
#   rootfs      installed from the published repository by lunar, the same way
#               the verification step does it
#   squashfs    built by the okra-linux pipeline's own build-squashfs
#   initramfs   the okra-linux pipeline's initramfs tree, packed as-is
#
# The ISO itself is assembled with grub-mkrescue rather than the pipeline's
# Limine call, because Limine ships source only and the boot sector files in
# that repository came from a build whose version is not recorded. Mismatched
# pieces there produce an ISO that does not start, which is a bad way to find
# out. grub-mkrescue brings its own boot code for both BIOS and UEFI.
#
# What this does not do: pack the installer. build-initramfs also builds the
# OKRAINSTALL payload and an EFI image for the installed disk, and it insists on
# a GRUB theme from a path on one developer's machine. Neither is needed to get
# the system to start.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the ISO to a release'
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  OKRA_TARGET_TRIPLE: x86_64-okra-linux-gnu
  OKRA_LINUX_REPOSITORY: FORGE24/okra-linux

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install what the build needs
        run: |
          # This runner's resolver cannot answer for the Ubuntu mirrors, so apt
          # fetch fails with Temporary failure resolving. Point it at the archive
          # addresses instead, and remove the mirrors file that names them.
          if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            sudo rm -f /etc/apt/apt-mirrors.txt
            {
              echo 'Types: deb'
              echo 'URIs: http://185.125.190.81/ubuntu/'
              echo 'Suites: noble noble-updates noble-backports'
              echo 'Components: main restricted universe multiverse'
              echo 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
              echo ''
              echo 'Types: deb'
              echo 'URIs: http://185.125.190.36/ubuntu/'
              echo 'Suites: noble-security'
              echo 'Components: main restricted universe multiverse'
              echo 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
            } | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake patchelf patch tar xz-utils zstd gzip bzip2 lzip file rsync \
            python3 wget curl ca-certificates git unzip \
            cpio squashfs-tools xorriso mtools dosfstools \
            grub-pc-bin grub-efi-amd64-bin

      - name: Fetch the oaa toolkit
        run: |
          set -euo pipefail
          # The upstream tree, the same one scheme-b and build-kernel read.
          git clone -q --depth 1 --branch main \
            "https://github.com/OkraLinux/okrapm.git" vendor/okrapm
          ./scripts/patch-okrapm.sh vendor/okrapm

      - name: Fetch the LiveCD pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone -q --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/$OKRA_LINUX_REPOSITORY.git" \
            "$GITHUB_WORKSPACE/okra-linux"
          ls "$GITHUB_WORKSPACE/okra-linux/live-build/scripts"

      - name: Build the host lunar
        run: |
          set -euo pipefail
          cmake -S vendor/okrapm -B "$RUNNER_TEMP/okrapm-build" \
            -DCMAKE_BUILD_TYPE=Release >/dev/null
          cmake --build "$RUNNER_TEMP/okrapm-build" -j4 --target lunar >/dev/null
          mkdir -p "$RUNNER_TEMP/host-lunar"
          cp "$RUNNER_TEMP/okrapm-build/src/lunar/lunar" "$RUNNER_TEMP/host-lunar/lunar"

      - name: Install the published userland as the rootfs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./scripts/install-published-userland.sh \
            "$RUNNER_TEMP/okra-rootfs" \
            "$RUNNER_TEMP/host-lunar/lunar" \
            repo
          # lunar installs as the user who ran it, so the tree comes out owned by
          # runner. In the image that is wrong twice over: systemd expects root
          # to own the files it starts, and every setuid binary stops being one.
          sudo chown -R 0:0 "$RUNNER_TEMP/okra-rootfs"
          # systemd installs a symlink to /dev/null over every unit it decides
          # does not apply - udevd, networkd, resolved, timesyncd among them. On a
          # real root that hides the unit; here the link travels into the image and
          # nothing undoes it, so udevd never runs and no device node ever appears.
          for Link in $(sudo find "$RUNNER_TEMP/okra-rootfs/etc/systemd/system" \
              -type l 2>/dev/null); do
            if [ "$(sudo readlink "$Link" 2>/dev/null)" = "/dev/null" ]; then
              sudo rm -f "$Link"
            fi
          done
          sudo find "$RUNNER_TEMP/okra-rootfs/etc/systemd/system" \
            -xtype l -delete 2>/dev/null || true
          echo "== dev-null links left:" \
            "$(sudo find "$RUNNER_TEMP/okra-rootfs/etc/systemd/system" -type l \
               -exec readlink {} \; 2>/dev/null | grep -c "^/dev/null$" || true)"
          if [ -x "$RUNNER_TEMP/okra-rootfs/usr/bin/systemctl" ]; then
            # preset-all writes into the config directory, so whatever it decides
            # is there afterwards. Let it run, then read back what it did to the
            # units a live image cannot work without.
            sudo chroot "$RUNNER_TEMP/okra-rootfs" /usr/bin/systemctl preset-all \
              >/dev/null 2>&1 || true
          fi

      - name: Put the kernel where the LiveCD scripts look for it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # build-kernel reuses an existing bzImage instead of compiling one, so
          # a kernel tree with nothing but the image in it is enough.
          mkdir -p "$RUNNER_TEMP/kernel/arch/x86/boot"
          touch "$RUNNER_TEMP/kernel/.config"
          for Name in bzImage; do
            curl -fsSL --retry 3 -m 600 -H "Authorization: token $GH_TOKEN" \
              -o "$RUNNER_TEMP/kernel/arch/x86/boot/$Name" \
              "https://github.com/ylh440104/okra-pm-bootstrap/releases/download/okra-kernel/$Name"
          done
          ls -l "$RUNNER_TEMP/kernel/arch/x86/boot/bzImage"
          file "$RUNNER_TEMP/kernel/arch/x86/boot/bzImage" || true

      - name: Build the LiveCD pieces
        run: |
          set -euo pipefail
          export PROJECT_ROOT="$GITHUB_WORKSPACE/okra-linux"
          export ROOTFS="$RUNNER_TEMP/okra-rootfs"
          export KERNEL_TREE="$RUNNER_TEMP/kernel"
          export ISO_ROOT="$PROJECT_ROOT/live-build/iso-root"
          export JOBS=4
          # The kernel is the one from the release; do not try to build it.
          bash "$PROJECT_ROOT/live-build/scripts/build-kernel"
          # The kernel built from this tree carries squashfs and overlayfs, so
          # the live root is a squashfs again - compressed, and inside the 4G
          # limit an ISO file has. The ext4 image this replaced reached 4.6G
          # and xorriso refused it.
          mkdir -p "$ISO_ROOT/LiveOS"
          rm -f "$ISO_ROOT/LiveOS/rootfs.ext4" "$ISO_ROOT/LiveOS/rootfs.squashfs"
          # systemd treats a unit as masked when /etc/systemd/system holds a
          # link to /dev/null for it, or an empty file of that name. The rebuild
          # and the preset run both leave such entries behind, and udevd ends up
          # in that list - which is why no device node ever appeared. Clear them
          # here, right before the image is made, so the check covers whatever
          # the steps above produced.
          for Entry in "$ROOTFS"/etc/systemd/system/*; do
            [ -e "$Entry" ] || [ -L "$Entry" ] || continue
            if [ -L "$Entry" ] && [ "$(readlink "$Entry")" = "/dev/null" ]; then
              echo "unmasking $(basename "$Entry")"
              sudo rm -f "$Entry"
            elif [ -f "$Entry" ] && [ ! -s "$Entry" ]; then
              echo "unmasking empty $(basename "$Entry")"
              sudo rm -f "$Entry"
            fi
          done
          echo "== entries left in /etc/systemd/system:"
          ls -la "$ROOTFS/etc/systemd/system" 2>/dev/null || true
          for Entry in "$ROOTFS"/etc/systemd/system/*; do
            [ -e "$Entry" ] || [ -L "$Entry" ] || continue
            if [ -L "$Entry" ]; then
              echo "  link $(basename "$Entry") -> $(readlink "$Entry" 2>/dev/null)"
            fi
          done
          echo "== udevd unit present: $([ -s "$ROOTFS/usr/lib/systemd/system/systemd-udevd.service" ] && echo yes || echo no)"
          # Whatever the preset run decides, these units have to be loadable on
          # the live image: without udevd there are no device nodes, and without
          # device nodes nothing else works. Unmask by removing the unit from the
          # config directory entirely, which is the only state systemd reads as
          # "not masked" no matter what form the mask took.
          for Unit in systemd-udevd.service systemd-udevd-control.socket \
                      systemd-udevd-kernel.socket systemd-udevd-varlink.socket \
                      systemd-udev-trigger.service systemd-udev-settle.service \
                      systemd-hwdb-update.service systemd-modules-load.service \
                      kmod-static-nodes.service ldconfig.service; do
            if [ -e "$ROOTFS/etc/systemd/system/$Unit" ] || [ -L "$ROOTFS/etc/systemd/system/$Unit" ]; then
              echo "clearing $Unit from the config directory"
              sudo rm -rf "$ROOTFS/etc/systemd/system/$Unit"
            fi
          done
          echo "== udevd service readable:" \
            "$(head -c 40 "$ROOTFS/usr/lib/systemd/system/systemd-udevd.service" 2>/dev/null | tr -d "\n")"
          # Show the units systemd itself sees, and what it says about udevd,
          # instead of inferring it from the files on disk.
          if [ -x "$ROOTFS/usr/bin/systemctl" ]; then
            echo "== systemctl list-unit-files (udev):"
            sudo chroot "$ROOTFS" /usr/bin/systemctl list-unit-files \
              "systemd-udevd*" --no-pager 2>&1 | head -8 || true
            echo "== mask links under /etc:"
            sudo find "$ROOTFS/etc/systemd" -type l \
              -exec sh -c 'printf "%s -> %s\n" "$1" "$(readlink "$1")"' _ {} \; \
              2>/dev/null | grep -i udev || echo "  none mention udev"
          fi
          # A .wants or .requires directory under /etc/systemd/system replaces
          # the one under /usr/lib entirely, instead of merging. The packages
          # leave directories there holding a single unit, so thirty vendor links
          # - including systemd-udevd.service - are never seen. Drop the /etc
          # copies and let systemd use the vendor ones.
          sudo find "$ROOTFS/etc/systemd/system" -maxdepth 1 \
            \( -name "*.wants" -o -name "*.requires" \) -type d -exec rm -rf {} + 2>/dev/null || true
          echo "== wants dirs under /etc:" \
            "$(find "$ROOTFS/etc/systemd/system" -maxdepth 1 -name "*.wants" 2>/dev/null | wc -l)"
          # Ask systemd directly, inside the image, instead of reasoning about it
          # from files. is-enabled and the LoadState say what systemd will do.
          if [ -x "$ROOTFS/usr/bin/systemctl" ]; then
            echo "== anything named udevd under /etc/systemd:"
            find "$ROOTFS/etc/systemd" -name "*udevd*" 2>/dev/null || true
            echo "== is-enabled: $(sudo chroot "$ROOTFS" /usr/bin/systemctl is-enabled systemd-udevd.service 2>&1 || true)"
            echo "== LoadState: $(sudo chroot "$ROOTFS" /usr/bin/systemctl show -p LoadState --value systemd-udevd.service 2>&1 || true)"
            echo "== UnitFileState: $(sudo chroot "$ROOTFS" /usr/bin/systemctl show -p UnitFileState --value systemd-udevd.service 2>&1 || true)"
            # The service is static, so it is started by the wants link on
            # sysinit.target. Ask systemd to wire that link rather than writing it
            # by hand.
            sudo chroot "$ROOTFS" /usr/bin/systemctl add-wants sysinit.target \
              systemd-udevd.service systemd-udev-trigger.service \
              systemd-modules-load.service kmod-static-nodes.service \
              systemd-hwdb-update.service 2>&1 | head -4 || true
            echo "== wants link after add-wants: $([ -e "$ROOTFS/etc/systemd/system/sysinit.target.wants/systemd-udevd.service" ] && echo yes || echo no)"

          fi
          # systemd install creates a symlink to /dev/null under
          # /etc/systemd/system for every unit the build turned off,
          # and these travel into the image. PID 1 then reads them at
          # startup, masks the units, and reports them as "not loaded".
          # The meson log says which ones, but the simplest thing that
          # works is to delete every dead link - one whose target does
          # not exist - from the whole /etc/systemd/system tree, and then
          # let systemd wire the ones that are actually there.
          sudo find "$ROOTFS/etc/systemd/system" -xtype l -delete 2>/dev/null || true
          echo "== dead links removed, entries left:" \
            "$(find "$ROOTFS/etc/systemd/system" -type l 2>/dev/null | wc -l)"
          # A compiled hardware database. The imds generator runs before any
          # service and opens this file directly; when it is absent the
          # generator fails and says so on every boot. Building it here also
          # means the boot-time update service finds nothing stale to redo.
          sudo chroot "$ROOTFS" /usr/bin/systemd-hwdb update
          ls -l "$ROOTFS/etc/udev/hwdb.bin"
          # The units the live init masks on purpose. The first boot presets
          # every unit in the search path, meets these masks, and logs a
          # failure for each one. Saying disable here states the same intent
          # the masks do, so the pass has nothing to complain about. The root
          # mount is generated each boot and cannot be enabled at all, so it
          # is left alone.
          sudo mkdir -p "$ROOTFS/usr/lib/systemd/system-preset"
          sudo tee "$ROOTFS/usr/lib/systemd/system-preset/99-okra-live.preset" >/dev/null <<'PRESET'
          disable serial-getty@ttyS0.service
          disable console-getty.service
          disable debug-shell.service
          disable systemd-ask-password-console.path
          disable systemd-ask-password-console.service
          disable ldconfig.service
          ignore -.mount
          PRESET
          cat "$ROOTFS/usr/lib/systemd/system-preset/99-okra-live.preset"
          # The wireless regulatory database. cfg80211 asks for it as soon as
          # it comes up and logs a failed firmware load when it is missing,
          # which it is on a machine with no wireless hardware of its own.
          sudo mkdir -p "$ROOTFS/usr/lib/firmware" "$ROOTFS/lib/firmware"
          sudo cp "$GITHUB_WORKSPACE/files/firmware/regulatory.db" \
                  "$GITHUB_WORKSPACE/files/firmware/regulatory.db.p7s" \
                  "$ROOTFS/lib/firmware/"
          ls -l "$ROOTFS/lib/firmware/"
          sudo mksquashfs "$ROOTFS" "$ISO_ROOT/LiveOS/rootfs.squashfs" \
            -comp zstd -noappend -no-progress -all-root -quiet
          echo "== the live root image"
          ls -l "$ISO_ROOT/LiveOS/rootfs.squashfs"
          # The initramfs tree in the repository is not usable as it stands:          # build-initramfs replaces bin/ with tools it installs itself and then          # copies the loader and the libraries in. Skipping that step is what
          # made the first ISO panic with "Failed to execute /init (error -2)" -
          # every binary in it is dynamically linked and there was nothing to
          # link against.
          INITRAMFS_TREE="$PROJECT_ROOT/live-build/initramfs"
          # The loader runs bash successfully, but mount still cannot see
          # libmount under /lib in this early root. Tell the dynamic loader to
          # search the standard library locations explicitly before /init runs.
          sed -i '/^export PATH=\/bin:\/usr\/bin:\/sbin:\/usr\/sbin$/a export LD_LIBRARY_PATH=\/lib:\/lib64:\/usr\/lib:\/usr\/lib64' "$INITRAMFS_TREE/init"
          # The init looks for rootfs.squashfs and mounts it as squashfs. This
          # kernel has no squashfs, so it takes rootfs.ext4 as well, through a
          # loop device, and the loop driver has to be loaded first.
          python3 "$GITHUB_WORKSPACE/scripts/patch-livecd-init.py" \
            "$INITRAMFS_TREE/init"

          rm -rf "$INITRAMFS_TREE/bin"
          mkdir -p "$INITRAMFS_TREE/bin"

          for Tool in ln cat rm cp chmod mkdir sleep readlink bash mount umount switch_root; do
            Source=""
            for Directory in usr/bin usr/sbin bin sbin; do
              if [ -x "$ROOTFS/$Directory/$Tool" ]; then Source="/$Directory/$Tool"; break; fi
            done
            [ -n "$Source" ] || { echo "missing $Tool in the rootfs" >&2; exit 1; }
            install -Dm755 "$ROOTFS$Source" "$INITRAMFS_TREE/bin/$Tool"
          done
          # /lib and /lib64 are symlinks to usr/lib and usr/lib64 in this rootfs.
          # Copying a path under them with cp -a copies the link, so the archive
          # ended up holding lib/libmount.so.1 as a link with no
          # libmount.so.1.1.0 beside it to point at - and the loader kept saying
          # it could not open the file.
          #
          # Every real file goes into usr/lib with the link followed (-L). Then
          # lib is put back as a link to usr/lib and the loader itself is placed
          # at the path compiled into the binaries.
          mkdir -p "$INITRAMFS_TREE/usr/lib" "$INITRAMFS_TREE/lib64"
          for Directory in lib lib64 usr/lib usr/lib64; do
            [ -e "$ROOTFS/$Directory" ] || continue
            for Library in "$ROOTFS/$Directory"/*.so*; do
              [ -e "$Library" ] || continue
              cp -aL "$Library" "$INITRAMFS_TREE/usr/lib/" || exit 1
            done
          done
          cp -aL "$ROOTFS/lib64/ld-linux-x86-64.so.2" "$INITRAMFS_TREE/lib64/" 2>/dev/null ||
            cp -aL "$ROOTFS/usr/lib64/ld-linux-x86-64.so.2" "$INITRAMFS_TREE/lib64/"
          ln -sfn usr/lib "$INITRAMFS_TREE/lib"
          # The regulatory database is asked for at 5s, while this initramfs is
          # still the root; the copy in the live root is too late for that.
          mkdir -p "$INITRAMFS_TREE/usr/lib/firmware"
          cp "$GITHUB_WORKSPACE/files/firmware/regulatory.db" \
             "$GITHUB_WORKSPACE/files/firmware/regulatory.db.p7s" \
             "$INITRAMFS_TREE/usr/lib/firmware/"
          echo "== what the loader will find"
          ls "$INITRAMFS_TREE/usr/lib" | sed -n "1,25p"
          ls -l "$INITRAMFS_TREE/lib" "$INITRAMFS_TREE/lib64"
          ln -sfn bash "$INITRAMFS_TREE/bin/sh"
          echo "== the initramfs now holds"
          # No pipe to head here: find is killed by SIGPIPE when head exits, and
          # with pipefail on that fails the step.
          find "$INITRAMFS_TREE" -type f -printf '   %P\n' | sed -n '1,30p' || true
          ( cd "$INITRAMFS_TREE" && find . -print0 | cpio --null -o -H newc 2>/dev/null | gzip -9 ) \
            > "$ISO_ROOT/boot/initramfs-live.img"
          ls -l "$ISO_ROOT/boot/" "$ISO_ROOT/LiveOS/"

      - name: Assemble the ISO
        run: |
          set -euo pipefail
          export PROJECT_ROOT="$GITHUB_WORKSPACE/okra-linux"
          export ISO_ROOT="$PROJECT_ROOT/live-build/iso-root"
          export ISO_IMAGE="$RUNNER_TEMP/okra-linux.iso"
          mkdir -p "$ISO_ROOT/boot/grub"
          cat > "$ISO_ROOT/boot/grub/grub.cfg" <<'GRUBCFG'
          set timeout=5
          set default=0
          insmod all_video
          insmod gfxterm
          terminal_output gfxterm
          menuentry "Okra Linux" {
              linux /boot/vmlinuz console=tty0 console=ttyS0,115200n8 nomodeset loglevel=6 systemd.show_status=yes rd.live.image
              initrd /boot/initramfs-live.img
          }
          GRUBCFG
          grub-mkrescue -o "$ISO_IMAGE" "$ISO_ROOT" \
            -- -volid OKRALINUX_BASE0 2>&1 | tail -12
          ls -l "$ISO_IMAGE"
          du -h "$ISO_IMAGE"

      - name: Check the ISO carries what the initramfs looks for
        run: |
          set -euo pipefail
          ISO="$RUNNER_TEMP/okra-linux.iso"
          xorriso -indev "$ISO" -find / -name 'rootfs.ext4' -exec lsdl 2>/dev/null | head -3
          xorriso -indev "$ISO" -find / -name 'rootfs.squashfs' -exec lsdl 2>/dev/null | head -3
          xorriso -indev "$ISO" -find /boot -name 'vmlinuz' -exec lsdl 2>/dev/null | head -3
          xorriso -indev "$ISO" -find /boot -name 'initramfs-live.img' -exec lsdl 2>/dev/null | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: okra-linux-iso
          path: ${{ runner.temp }}/okra-linux.iso
          if-no-files-found: error
          retention-days: 14

      - name: Attach the ISO to a release
        if: ${{ github.event.inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          Tag=okra-linux-iso
          gh release view "$Tag" >/dev/null 2>&1 || gh release create "$Tag" \
            --title "Okra Linux ISO" \
            --notes "A bootable ISO built from the userland the bootstrap published. The root filesystem is the repository installed by lunar; the kernel is the one the LiveCD pipeline has always used; the ISO is assembled with grub-mkrescue."
          gh release upload "$Tag" "$RUNNER_TEMP/okra-linux.iso" --clobber
          gh release view "$Tag" --json assets --jq '.assets[] | "\(.name) \(.size)"'