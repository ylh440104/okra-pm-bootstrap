name: Install to a blank disk and boot what it wrote

# The end-to-end acceptance of the installer. A blank virtio disk is attached,
# the ISO boots its installer entry through the GRUB menu, stage 1 partitions
# and copies the Base OS, and the test then boots the written disk directly and
# watches for the phase-2 marker. The live medium is removed for the second
# boot, so what comes up is only what the installer wrote.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per QEMU run'
        default: '1500'

permissions:
  contents: read

env:
  ISO_NAME: okra-linux.iso

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install what the test needs
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 fuse2fs coreutils

      - name: Get the ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -m 900 -H "Authorization: token $GH_TOKEN" \
            -o "$RUNNER_TEMP/okra-linux.iso" \
            "https://github.com/ylh440104/okra-pm-bootstrap/releases/download/okra-linux-iso/okra-linux.iso"
          ls -l "$RUNNER_TEMP/okra-linux.iso"

      - name: Install stage 1 onto a blank disk
        env:
          SECONDS_TO_RUN: ${{ github.event.inputs.seconds }}
          LOG: ${{ runner.temp }}/install.log
          DISK: ${{ runner.temp }}/disk.img
        run: |
          set -uo pipefail
          truncate -s 12G "$DISK"
          rm -f "$LOG"

          # The kernel command line comes from QEMU, not the menu. What this
          # step proves is what stage 1 does to a disk; the menu is only how
          # a human reaches it, and driving GRUB over a serial line is its
          # own problem - the digits sent there in the last runs never
          # arrived, and the countdown took the default every time. The
          # arguments the installer menuentry carries are passed directly.
          MNT=$(mktemp -d)
          sudo mount -o loop,ro "$RUNNER_TEMP/okra-linux.iso" "$MNT"
          cp "$MNT/boot/vmlinuz" "$RUNNER_TEMP/vmlinuz"
          cp "$MNT/boot/initramfs-live.img" "$RUNNER_TEMP/initramfs-live.img"
          sudo umount "$MNT"
          rmdir "$MNT"
          ls -l "$RUNNER_TEMP/vmlinuz" "$RUNNER_TEMP/initramfs-live.img"

          # The installer draws its menu on the serial console this command
          # line names, and the answers arrive through a fifo as the
          # prompts appear: stage 1 asks to begin, which disk, and whether
          # to erase. All of them take the first or default choice, which
          # is right for a machine with exactly one blank disk.
          FIFO="$RUNNER_TEMP/serial.in"
          DRIVER="$RUNNER_TEMP/driver.log"
          mkfifo "$FIFO"

          driver() {
            await() {
              waited=0
              while [ "$waited" -lt "$2" ]; do
                grep -q "$1" "$LOG" 2>/dev/null && return 0
                sleep 4
                waited=$((waited + 4))
              done
              echo "  (never saw: $1)" >&2
              return 1
            }
            send_key() { printf '%b' "$1"; }

            if await 'timezone name or number' 900; then
              sleep 3
              send_key '\r'
              echo "  skipped the timezone question" >&2
            fi
            # A yes/no prompt offers No first when its default is no, so
            # Enter alone picks No - the first run confirmed the stage and
            # cancelled in the same keystroke. The key handler reads y as
            # yes directly, which needs no selection at all.
            if await 'Start stage 1?' 900; then
              sleep 3
              send_key 'y'
              echo "  confirmed stage 1" >&2
            fi
            # The blank virtio disk is the only one offered, so the first
            # menu item is the right one and Enter takes it.
            if await 'Choose the disk to use' 900; then
              sleep 3
              send_key '\r'
              echo "  chose the only disk" >&2
            fi
            if await 'Erase the whole disk?' 900; then
              sleep 3
              send_key 'y'
              echo "  agreed to erase" >&2
            fi
            if await 'Write the Base OS to this disk?' 900; then
              sleep 3
              send_key 'y'
              echo "  started the write" >&2
            fi
            if await 'Stage 1 done' 1800; then
              echo "  stage 1 completed" >&2
            fi
            sleep 90
          }
          driver > "$FIFO" 2> "$DRIVER" &

          timeout "${SECONDS_TO_RUN:-1500}" qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -kernel "$RUNNER_TEMP/vmlinuz" \
            -initrd "$RUNNER_TEMP/initramfs-live.img" \
            -append "console=ttyS0,115200n8 nomodeset loglevel=6 systemd.show_status=yes rd.live.image okra.install" \
            -cdrom "$RUNNER_TEMP/okra-linux.iso" \
            -drive "file=$DISK,format=raw,if=virtio" \
            -display none -serial stdio -no-reboot \
            < "$FIFO" > "$LOG" 2>&1 || true

          kill "$(jobs -p)" 2>/dev/null || true
          rm -f "$FIFO"

      - name: Say what the install did
        if: always()
        run: |
          set -uo pipefail
          echo "== what the driver did"
          cat "$RUNNER_TEMP/driver.log" 2>/dev/null || true
          echo
          echo "== the install serial, milestones"
          grep -nE 'LiveCD init|okrainstall|Stage|stage|partitio|error|Error|failed|FAILED' \
            "$RUNNER_TEMP/install.log" 2>/dev/null | tail -40 || true
          echo
          echo "== the last lines"
          tail -20 "$RUNNER_TEMP/install.log" 2>/dev/null || true

      - name: Check the disk got a system
        if: always()
        run: |
          set -uo pipefail
          DISK="$RUNNER_TEMP/disk.img"
          ls -l "$DISK"
          echo "== partition table"
          sfdisk -d "$DISK" 2>/dev/null || true

          echo "== phase marker on the installed disk"
          start_sector=$(sfdisk -d "$DISK" 2>/dev/null \
            | sed -n 's/.*start=[[:space:]]*\([0-9][0-9]*\).*type=0FC63DAF.*/\1/p' | head -n 1)
          if [ -n "$start_sector" ]; then
            OFFSET=$((start_sector * 512))
            MNT=$(mktemp -d)
            if fuse2fs -o "ro,offset=$OFFSET" "$DISK" "$MNT" 2>/dev/null; then
              echo "phase: $(tr -d '[:space:]' < "$MNT/var/lib/okrainstall/phase" 2>/dev/null || echo missing)"
              test -x "$MNT/usr/bin/okrainstall" && echo "okrainstall present" || echo "okrainstall MISSING"
              test -f "$MNT/boot/vmlinuz" && echo "kernel present" || echo "kernel MISSING"
              test -f "$MNT/etc/fstab" && echo "fstab present" || echo "fstab MISSING"
              test -f "$MNT/usr/lib/okrainstall/grub/BOOTX64.EFI" && echo "EFI binary present" || echo "EFI binary MISSING"
              fusermount -u "$MNT" || fusermount3 -u "$MNT" || true
            else
              echo "fuse2fs could not mount the root partition"
            fi
            rmdir "$MNT" 2>/dev/null || true
          else
            echo "no root partition found - the install did not partition the disk"
          fi

      - name: Boot what the installer wrote
        env:
          SECONDS_TO_RUN: 900
          BOOTLOG: ${{ runner.temp }}/boot.log
          DISK: ${{ runner.temp }}/disk.img
        run: |
          set -uo pipefail
          # The kernel the installer copied is what starts here, straight from
          # the written disk: no medium, no host kernel. What boots is only what
          # stage 1 put there.
          timeout 900 qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -drive "file=$DISK,format=raw,if=virtio" \
            -bios /usr/share/qemu/OVMF.fd \
            -display none -serial stdio -no-reboot \
            > "$BOOTLOG" 2>&1 || true

          echo "== what the written disk said"
          grep -nE 'okrainstall|phase|Stage|FAILED|error' "$BOOTLOG" 2>/dev/null | head -30 || true
          echo
          tail -30 "$BOOTLOG" 2>/dev/null || true

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okra-install-diag
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/boot.log
            ${{ runner.temp }}/driver.log
          if-no-files-found: warn
          retention-days: 14