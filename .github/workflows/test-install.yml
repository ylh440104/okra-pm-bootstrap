name: Install to a blank disk and boot what it wrote

# The end-to-end acceptance of the installer. A blank virtio disk is attached,
# the ISO boots its installer entry through the GRUB menu, stage 1 partitions
# and copies the Base OS, and the test then boots the written disk directly and
# watches for the phase-2 marker. The live medium is removed for the second
# boot, so what comes up is only what the installer wrote.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per QEMU run'
        default: '1500'

permissions:
  contents: read

env:
  ISO_NAME: okra-linux.iso

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install what the test needs
        run: |
          set -euo pipefail
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf fuse2fs coreutils

      - name: Get the ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -m 900 -H "Authorization: token $GH_TOKEN" \
            -o "$RUNNER_TEMP/okra-linux.iso" \
            "https://github.com/ylh440104/okra-pm-bootstrap/releases/download/okra-linux-iso/okra-linux.iso"
          ls -l "$RUNNER_TEMP/okra-linux.iso"

      - name: Install stage 1 onto a blank disk
        env:
          SECONDS_TO_RUN: ${{ github.event.inputs.seconds }}
          LOG: ${{ runner.temp }}/install.log
          DISK: ${{ runner.temp }}/disk.img
        run: |
          set -uo pipefail
          truncate -s 12G "$DISK"
          rm -f "$LOG"

          # The kernel command line comes from QEMU, not the menu. What this
          # step proves is what stage 1 does to a disk; the menu is only how
          # a human reaches it, and driving GRUB over a serial line is its
          # own problem - the digits sent there in the last runs never
          # arrived, and the countdown took the default every time. The
          # arguments the installer menuentry carries are passed directly.
          MNT=$(mktemp -d)
          sudo mount -o loop,ro "$RUNNER_TEMP/okra-linux.iso" "$MNT"
          cp "$MNT/boot/vmlinuz" "$RUNNER_TEMP/vmlinuz"
          cp "$MNT/boot/initramfs-live.img" "$RUNNER_TEMP/initramfs-live.img"
          sudo umount "$MNT"
          rmdir "$MNT"
          ls -l "$RUNNER_TEMP/vmlinuz" "$RUNNER_TEMP/initramfs-live.img"

          # The installer draws its menu on the serial console this command
          # line names, and the answers arrive through a fifo as the
          # prompts appear: stage 1 asks to begin, which disk, and whether
          # to erase. All of them take the first or default choice, which
          # is right for a machine with exactly one blank disk.
          FIFO="$RUNNER_TEMP/serial.in"
          DRIVER="$RUNNER_TEMP/driver.log"
          mkfifo "$FIFO"

          driver() {
            await() {
              waited=0
              while [ "$waited" -lt "$2" ]; do
                grep -q "$1" "$LOG" 2>/dev/null && return 0
                sleep 4
                waited=$((waited + 4))
              done
              echo "  (never saw: $1)" >&2
              return 1
            }
            send_key() { printf '%b' "$1"; }

            if await 'timezone name or number' 900; then
              sleep 3
              send_key '\r'
              echo "  skipped the timezone question" >&2
            fi
            # A yes/no prompt offers No first when its default is no, so
            # Enter alone picks No - the first run confirmed the stage and
            # cancelled in the same keystroke. The key handler reads y as
            # yes directly, which needs no selection at all.
            if await 'Start stage 1?' 900; then
              sleep 3
              send_key 'y'
              echo "  confirmed stage 1" >&2
            fi
            # The blank virtio disk is the only one offered, so the first
            # menu item is the right one and Enter takes it.
            if await 'Choose the disk to use' 900; then
              sleep 3
              send_key '\r'
              echo "  chose the only disk" >&2
            fi
            if await 'Erase the whole disk?' 900; then
              sleep 3
              send_key 'y'
              echo "  agreed to erase" >&2
            fi
            if await 'Write the Base OS to this disk?' 900; then
              sleep 3
              send_key 'y'
              echo "  started the write" >&2
            fi
            # The shell answering alongside the installer is how the last
            # run died: two programs read one tty and the wrong one got the
            # key. If the shell prompt appears the mask in the init did not
            # hold, and knowing that here beats finding it out afterwards.
            # If the shell is up instead of the installer, ask the machine
            # itself what the init decided and what it found.
            if grep -q 'root@okra' "$LOG" 2>/dev/null; then
              echo "  shell came up instead of the installer - asking it why" >&2
              send_key 'ls -l /usr/bin/okrainstall /usr/libexec/okrainstall-stage1 2>&1; echo ---; cat /proc/cmdline; echo ---; ls /run/live/ 2>&1; echo ---; ls -l /etc/systemd/system/autologin-console.service 2>&1; echo ---; systemctl is-enabled okrainstall-live.service 2>&1; echo ---; systemctl cat okrainstall-live.service 2>&1 | head -20\r'
              sleep 25
            fi
            # The shell that came up instead of the installer can answer for
            # itself: what it has, what the command line said, and what systemd
            # thinks of the installer unit.
            sleep 30
            send_key 'ls -l /usr/bin/okrainstall; echo RC=$?; cat /proc/cmdline; echo; ls -l /etc/systemd/system/multi-user.target.wants/ 2>&1 | head -12\r'
            echo "  asked the shell for the installer and the command line" >&2
            sleep 25

            if await 'Stage 1 done' 1800; then
              echo "  stage 1 completed" >&2
            fi
            if grep -q 'root@okra' "$LOG" 2>/dev/null; then
              echo "  WARNING: the autologin shell is up with the installer - the init mask did not hold" >&2
              # The shell is alive, so ask it directly what is running and
              # whether the mask the init should have written exists.
              send_key 'systemctl status autologin-console.service --no-pager 2>&1 | head -5; ls -l /etc/systemd/system/autologin-console.service; systemctl list-units --type=service --state=running --no-pager | head -15\r'
              echo "  asked the shell what is running" >&2
              sleep 20
            fi
            sleep 60
          }
          driver > "$FIFO" 2> "$DRIVER" &

          timeout "${SECONDS_TO_RUN:-1500}" qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -kernel "$RUNNER_TEMP/vmlinuz" \
            -initrd "$RUNNER_TEMP/initramfs-live.img" \
            -append "console=ttyS0,115200n8 nomodeset loglevel=6 systemd.show_status=yes rd.live.image okra.install" \
            -cdrom "$RUNNER_TEMP/okra-linux.iso" \
            -drive "file=$DISK,format=raw,if=virtio" \
            -display none -serial stdio -no-reboot \
            < "$FIFO" > "$LOG" 2>&1 || true

          kill "$(jobs -p)" 2>/dev/null || true
          rm -f "$FIFO"

      - name: Say what the install did
        if: always()
        run: |
          set -uo pipefail
          echo "== what the driver did"
          cat "$RUNNER_TEMP/driver.log" 2>/dev/null || true
          echo
          echo "== the install serial, milestones"
          grep -nE 'LiveCD init|okrainstall|Stage|stage|partitio|error|Error|failed|FAILED' \
            "$RUNNER_TEMP/install.log" 2>/dev/null | tail -40 || true
          echo
          echo "== the last lines"
          tail -20 "$RUNNER_TEMP/install.log" 2>/dev/null || true

      - name: Check the disk got a system
        if: always()
        run: |
          set -uo pipefail
          DISK="$RUNNER_TEMP/disk.img"
          ls -l "$DISK"
          echo "== partition table"
          sfdisk -d "$DISK" 2>/dev/null || true

          echo "== phase marker on the installed disk"
          start_sector=$(sfdisk -d "$DISK" 2>/dev/null \
            | sed -n 's/.*start=[[:space:]]*\([0-9][0-9]*\).*type=0FC63DAF.*/\1/p' | head -n 1)
          if [ -n "$start_sector" ]; then
            OFFSET=$((start_sector * 512))
            MNT=$(mktemp -d)
            if fuse2fs -o "ro,offset=$OFFSET" "$DISK" "$MNT" 2>/dev/null; then
              echo "phase: $(tr -d '[:space:]' < "$MNT/var/lib/okrainstall/phase" 2>/dev/null || echo missing)"
              test -x "$MNT/usr/bin/okrainstall" && echo "okrainstall present" || echo "okrainstall MISSING"
              test -f "$MNT/boot/vmlinuz" && echo "kernel present" || echo "kernel MISSING"
              test -f "$MNT/etc/fstab" && echo "fstab present" || echo "fstab MISSING"
              test -f "$MNT/usr/lib/okrainstall/grub/BOOTX64.EFI" && echo "EFI binary present" || echo "EFI binary MISSING"
          test -f "$MNT/usr/lib/systemd/system/okrainstall-continue.service" && echo "continue unit present" || echo "continue unit MISSING"
          test -f "$MNT/usr/lib/systemd/system/okrainstall-live.service" && echo "live unit still there" || echo "live unit gone"
          ls -l "$MNT/etc/systemd/system/multi-user.target.wants/" 2>&1 | head -12
          for b in lib lib64 usr/lib usr/lib64 usr/lib64/ld-linux-x86-64.so.2; do
            printf '%s: ' "$b"
            ls -ld "$MNT/$b" 2>&1 | sed 's/^/  /' || true
          done
          echo "== usr/lib64 contents"
          ls -l "$MNT/usr/lib64/" 2>&1 | head -8
          echo "== where is an interpreter anywhere in usr"
          find "$MNT/usr" -name 'ld-linux*' 2>/dev/null | head -5
          echo "== does mount resolve inside the disk"
          strings "$MNT/bin/mount" 2>/dev/null | grep -m1 'ld-linux' || echo "no interpreter string"
          test -x "$MNT/lib64/ld-linux-x86-64.so.2" && echo "interpreter present at lib64" || echo "interpreter NOT at lib64"
          test -x "$MNT/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2" && echo "interpreter present at lib/x86_64" || echo "interpreter NOT at lib/x86_64"
          echo "== sbin layout"
          ls -ld "$MNT/sbin" "$MNT/usr/sbin" 2>&1 | sed 's/^/  /'
          echo "== where okra-init lives"
          ls -l "$MNT/sbin/okra-init" "$MNT/sbin/okra-init.real" "$MNT/usr/sbin/okra-init" 2>&1 | sed 's/^/  /' || true
          echo "== okra-init full"
          cat "$MNT/sbin/okra-init" 2>/dev/null | head -60 || echo none
          echo "== stage1 debug"
          cat "$MNT/var/lib/okrainstall/stage1-debug.log" 2>&1 | sed 's/^/  /'
          echo "== unit counts"
          for d in usr/lib/systemd/system etc/systemd/system; do
            printf '%s: ' "$d"
            ls "$MNT/$d" 2>/dev/null | wc -l
          done
          echo "== usr/bin mount"
          ls -l "$MNT/usr/bin/mount" "$MNT/usr/bin/umount" 2>&1 | sed 's/^/  /' || true
          echo "== libmount on the disk"
          ls -l "$MNT/usr/lib/libmount.so.1.1.0" "$MNT/lib/libmount.so.1.1.0" "$MNT/usr/lib/libmount.so.1" 2>&1 | sed 's/^/  /' || true
          find "$MNT/usr/lib" "$MNT/lib" -maxdepth 2 -name 'libmount*' 2>/dev/null | head -4
          echo "== fstab"
          cat "$MNT/etc/fstab" 2>&1
              fusermount -u "$MNT" || fusermount3 -u "$MNT" || true
            else
              echo "fuse2fs could not mount the root partition"
            fi
            rmdir "$MNT" 2>/dev/null || true
          else
            echo "no root partition found - the install did not partition the disk"
          fi

      - name: Drive stage 2 and stage 3 on the installed system
        env:
          SECONDS_TO_RUN: 1500
          BOOTLOG: ${{ runner.temp }}/boot2.log
          DISK: ${{ runner.temp }}/disk.img
        run: |
          set -uo pipefail
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          [ -f "$OVMF_CODE" ] || OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
          [ -f "$OVMF_VARS" ] || OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          cp "$OVMF_VARS" "$RUNNER_TEMP/ovmf-vars.fd"
          FIFO="$RUNNER_TEMP/fifo2"
          DRIVER="$RUNNER_TEMP/driver2.log"
          rm -f "$FIFO"; mkfifo "$FIFO"
          drive() {
            await() {
              waited=0
              while [ "$waited" -lt "$2" ]; do
                grep -q "$1" "$BOOTLOG" 2>/dev/null && return 0
                sleep 4
                waited=$((waited + 4))
              done
              echo "  (never saw: $1)" >&2
              return 1
            }
            send_key() { printf '%b' "$1"; }
            if await 'waiting for Enter' 600; then
              sleep 5
              send_key '\r'
              echo "  stage 2 done acknowledged; rebooting into stage 3" >&2
            fi
            # systemd prints 'Hostname set to <okralinux>' on every boot, and the
            # last run matched that instead of stage 3's question: the Enter it
            # sent arrived before any prompt existed and was thrown away, so the
            # install sat waiting on the hostname forever. Wait for the stage 3
            # heading first, then for the question itself.
            if await 'Stage 3' 900; then
              echo "  stage 3 is up" >&2
            fi
            if await 'Hostname' 900; then
              sleep 5
              send_key '\r'
              echo "  took the default hostname" >&2
            fi
            if await 'Username' 900; then
              sleep 5
              send_key 'okra\r'
              echo "  named the user okra" >&2
            fi
            if await 'Password' 900; then
              sleep 5
              send_key 'okrapass\r'
              echo "  typed the password" >&2
              sleep 4
              send_key 'okrapass\r'
              echo "  confirmed the password" >&2
            fi
            if await 'Timezone' 900; then
              sleep 5
              send_key '\r'
              echo "  took the default timezone" >&2
            fi
            if await 'Write this configuration and finish installation?' 900; then
              sleep 5
              send_key 'y'
              echo "  confirmed the final configuration" >&2
            fi
            if await 'Installation complete' 900; then
              echo "  stage 3 finished" >&2
            fi
            if await 'Reboot now?' 600; then
              sleep 5
              send_key 'n'
              echo "  declined the immediate reboot to keep the machine up" >&2
            fi
          }
          drive > "$FIFO" 2> "$DRIVER" &
          # No -no-reboot here on purpose: stage 2 ends with systemctl reboot,
          # and stage 3 only exists after that restart. Letting qemu restart
          # the machine is what turns two stages into one run.
          timeout "${SECONDS_TO_RUN}" qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -drive "file=$DISK,format=raw,if=virtio" \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE" \
            -drive "if=pflash,format=raw,file=$RUNNER_TEMP/ovmf-vars.fd" \
            -display none -serial stdio \
            < "$FIFO" > "$BOOTLOG" 2>&1 || true
          kill "$(jobs -p)" 2>/dev/null || true
          rm -f "$FIFO"
          echo "== what the stage 2/3 driver did"
          cat "$DRIVER" 2>/dev/null || true
          echo "== the installed system after stage 3"
          if grep -q 'Installation complete' "$BOOTLOG" 2>/dev/null; then
            echo "PASS: stage 3 ran to completion on the installed disk"
          else
            echo "FAIL: stage 3 did not complete" >&2
            tail -40 "$BOOTLOG" 2>/dev/null || true
            exit 1
          fi
      - name: Log in to the finished system
        if: always()
        env:
          SECONDS_TO_RUN: 600
          BOOTLOG: ${{ runner.temp }}/boot3.log
          DISK: ${{ runner.temp }}/disk.img
        run: |
          set -uo pipefail
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          [ -f "$OVMF_CODE" ] || OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
          [ -f "$OVMF_VARS" ] || OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          cp "$OVMF_VARS" "$RUNNER_TEMP/ovmf-vars3.fd"
          FIFO="$RUNNER_TEMP/fifo3"
          DRIVER="$RUNNER_TEMP/driver3.log"
          rm -f "$FIFO"; mkfifo "$FIFO"
          drive() {
            await() {
              waited=0
              while [ "$waited" -lt "$2" ]; do
                grep -q "$1" "$BOOTLOG" 2>/dev/null && return 0
                sleep 4
                waited=$((waited + 4))
              done
              echo "  (never saw: $1)" >&2
              return 1
            }
            send_key() { printf '%b' "$1"; }
            # agetty writes the prompt straight to the serial line rather than
            # through the kernel log, and a line nobody has touched since boot
            # can sit without flushing. Wait briefly, then poke it with a
            # newline and say what the line really shows, so a run that fails
            # here explains itself instead of printing one word.
            if await 'login:' 60; then
              echo "  the login prompt came up" >&2
              sleep 5
              send_key 'okra\r'
            else
              send_key '\r'
              sleep 5
              if await 'login:' 120; then
                echo "  the login prompt came up after a newline" >&2
                sleep 3
                send_key 'okra\r'
              else
                echo "  the serial line never offered a login; it ends with:" >&2
                tail -20 "$BOOTLOG" | sed 's/\r//' | cut -c1-120 >&2 || true
              fi
            fi
            if await 'Password:' 120; then
              echo "  the password prompt came up" >&2
              sleep 5
              send_key 'okrapass\r'
            fi
            sleep 8
            send_key 'echo MARK_IN\r'
            if await 'MARK_IN' 120; then
              echo "  logged in as okra" >&2
            fi
            sleep 3
            send_key 'findmnt -n -o FSTYPE /\r'
            if await 'ext4' 120; then
              echo "  findmnt answered" >&2
            fi
            sleep 3
            send_key 'systemctl is-system-running\r'
            if await 'running' 180; then
              echo "  systemd reports a running system" >&2
            fi
            sleep 3
            send_key 'echo okrapass | sudo -S sh -c "mkdir -p /mnt/probe && mount -t tmpfs tmpfs /mnt/probe && echo MOUNT_OK && umount /mnt/probe"\r'
            if await 'MOUNT_OK' 180; then
              echo "  sudo granted root and the mount ran" >&2
            fi
            sleep 3
            send_key 'systemctl --no-pager list-units --type=mount\r'
            sleep 10
            send_key 'echo ALL_DONE\r'
            await 'ALL_DONE' 60 || true
          }
          drive > "$FIFO" 2> "$DRIVER" &
          timeout "${SECONDS_TO_RUN}" qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -drive "file=$DISK,format=raw,if=virtio" \
            -drive "if=pflash,format=raw,readonly=on,file=$OVMF_CODE" \
            -drive "if=pflash,format=raw,file=$RUNNER_TEMP/ovmf-vars3.fd" \
            -display none -serial stdio \
            < "$FIFO" > "$BOOTLOG" 2>&1 || true
          kill "$(jobs -p)" 2>/dev/null || true
          rm -f "$FIFO"
          echo "== what the session did"
          cat "$DRIVER" 2>/dev/null || true
          echo "== the session on the console"
          tail -40 "$BOOTLOG" 2>/dev/null | sed 's/\r//' || true
          fails=0
          check() {
            if grep -q "$2" "$BOOTLOG" 2>/dev/null; then
              echo "  PASS: $1"
            else
              echo "  FAIL: $1" >&2
              fails=$((fails + 1))
            fi
          }
          check 'the finished system boots to a login prompt' 'login:'
          check 'okra logs in over the serial console' 'MARK_IN'
          check 'the root filesystem is ext4' 'ext4'
          check 'systemd reports a running system' 'running'
          check 'sudo grants root and mount works' 'MOUNT_OK'
          echo
          if [ "$fails" -gt 0 ]; then
            echo "FAIL: $fails check(s) did not pass" >&2
            exit 1
          fi
          echo 'PASS: the finished system logs in and can administer itself'
      - name: Verify the finished system
        if: always()
        env:
          DISK: ${{ runner.temp }}/disk.img
        run: |
          set -uo pipefail
          start_sector=$(sfdisk -d "$DISK" 2>/dev/null \
            | sed -n 's/.*start=[[:space:]]*\([0-9][0-9]*\).*type=0FC63DAF.*/\1/p' | head -n 1)
          if [ -z "$start_sector" ]; then
            echo "no root partition found" >&2
            exit 1
          fi
          OFFSET=$((start_sector * 512))
          MNT=$(mktemp -d)
          # The machine was stopped by a timeout rather than shut down cleanly,
          # so the ext4 journal is dirty and a plain read-only mount refuses it.
          # noload skips the replay and lets the check look at the files anyway.
          LOOP=$(sudo losetup -f --show -o "$OFFSET" "$DISK" 2>/dev/null || true)
          mounted=no
          if [ -n "$LOOP" ]; then
            if sudo mount -o ro,noload "$LOOP" "$MNT" 2>/dev/null; then
              mounted=yes
            fi
          fi
          if [ "$mounted" = no ]; then
            if fuse2fs -o "ro,offset=$OFFSET" "$DISK" "$MNT" 2>/dev/null; then
              mounted=fuse
            fi
          fi
          if [ "$mounted" = no ]; then
            echo "could not mount the finished system" >&2
            [ -n "$LOOP" ] && sudo losetup -d "$LOOP" 2>/dev/null || true
            exit 1
          fi
          echo "== the finished system"
          fails=0
          report() {
            if [ "$2" = "yes" ]; then
              printf '  %-32s %s\n' "$1" "$3"
            else
              printf '  %-32s %s\n' "$1" "$3" >&2
              fails=$((fails + 1))
            fi
          }
          if [ -f "$MNT/var/lib/okrainstall/phase" ]; then
            report 'phase marker' no 'still present'
          else
            report 'phase marker' yes 'gone, as stage 3 should leave it'
          fi
          [ -d "$MNT/home/okra" ] && report 'home directory' yes present || report 'home directory' no missing
          grep -q '^okra:' "$MNT/etc/passwd" && report 'user in passwd' yes present || report 'user in passwd' no missing
          # shadow is mode 000 to the reader and grep is denied before it can
          # open it. sudo cat opens it with privileges; -H says no match, an
          # error says the file itself is gone, which is a different failure.
          if sudo grep -q '^okra:' "$MNT/etc/shadow" 2>/dev/null; then
            report 'user in shadow' yes present
          elif [ -f "$MNT/etc/shadow" ]; then
            report 'user in shadow' no 'present but unreadable'
          else
            report 'user in shadow' no missing
          fi
          [ -f "$MNT/etc/localtime" ] && report 'localtime' yes set || report 'localtime' no missing
          [ -e "$MNT/usr/bin/okrainstall" ] && report 'installer binary' no 'still there' || report 'installer binary' yes removed
          [ -e "$MNT/usr/lib/systemd/system/okrainstall-continue.service" ] \
            && report 'continue unit' no 'still there' || report 'continue unit' yes removed
          [ -e "$MNT/usr/lib/systemd/system/okrainstall-live.service" ] \
            && report 'live unit' no 'still there' || report 'live unit' yes removed
          if [ -L "$MNT/etc/systemd/system/getty.target.wants/getty@tty1.service" ]; then
            report 'getty on tty1' yes 'linked for the first login'
          else
            ls -l "$MNT/etc/systemd/system/getty.target.wants/" 2>&1 | sed 's/^/    /'
            report 'getty on tty1' no 'not linked'
          fi
          if [ -L "$MNT/etc/systemd/system/getty.target.wants/serial-getty@ttyS0.service" ]; then
            report 'getty on the serial console' yes 'linked for headless login'
          else
            report 'getty on the serial console' no 'not linked'
          fi
          if grep -q '^DHCP=yes' "$MNT/etc/systemd/network/20-wired.network" 2>/dev/null; then
            report 'DHCP network file' yes 'wired interfaces ask for DHCP'
          else
            report 'DHCP network file' no 'missing'
          fi
          [ -L "$MNT/etc/systemd/system/multi-user.target.wants/systemd-networkd.service" ] \
            && report 'networkd' yes enabled || report 'networkd' no 'not enabled'
          [ -L "$MNT/etc/systemd/system/sysinit.target.wants/systemd-timesyncd.service" ] \
            && report 'timesyncd' yes enabled || report 'timesyncd' no 'not enabled'
          if [ -f "$MNT/etc/sudoers.d/10-wheel" ]; then
            report 'sudo for wheel' yes 'rule written'
          else
            report 'sudo for wheel' no 'no rule'
          fi
          for t in ip ping passwd tar find; do
            if [ -e "$MNT/usr/bin/$t" ] || [ -e "$MNT/bin/$t" ]; then
              report "tool $t" yes present
            else
              report "tool $t" no missing
            fi
          done
          for f in sbin/agetty bin/login usr/bin/passwd etc/pam.d/login; do
            if [ -e "$MNT/$f" ]; then
              report "$f" yes present
            else
              report "$f" no missing
            fi
          done
          entries=$(grep -c '^menuentry ' "$MNT/boot/grub2/grub.cfg" 2>/dev/null || echo 0)
          if [ "$entries" -ge 3 ]; then
            report 'boot entries' yes "$entries (normal, direct, recovery)"
          else
            report 'boot entries' no "only $entries"
          fi
          if grep -q "recovery shell" "$MNT/boot/grub2/grub.cfg" 2>/dev/null; then
            report 'recovery shell entry' yes 'init=/bin/bash available'
          else
            report 'recovery shell entry' no missing
          fi
          if [ -f "$MNT/boot/initramfs" ]; then
            report 'initramfs on the boot disk' yes present
          else
            report 'initramfs on the boot disk' no missing
          fi
          if grep -q 'initrd /boot/initramfs' "$MNT/boot/grub2/grub.cfg" 2>/dev/null; then
            report 'grub loads the initramfs' yes yes
          else
            report 'grub loads the initramfs' no 'no initrd line'
          fi
          # e2fsprogs puts its checker in usr/sbin. When it is not there the
          # archive shipped it and something between the archive and the disk
          # dropped it, so report what sbin actually holds before failing.
          if [ -e "$MNT/usr/sbin/e2fsck" ] || [ -e "$MNT/usr/sbin/fsck.ext4" ]; then
            report 'tool fsck (ext4)' yes present
          else
            report 'tool fsck (ext4)' no missing
            echo "    usr/sbin holds:" >&2
            ls "$MNT/usr/sbin" 2>/dev/null | sed 's/^/      /' >&2 || echo '      (no usr/sbin at all)' >&2
            echo "    anything named *fsck* on the disk:" >&2
            find "$MNT" -xdev -name '*fsck*' 2>/dev/null | sed 's/^/      /' >&2
            echo "    mkfs tools:" >&2
            find "$MNT" -xdev -name 'mkfs*' 2>/dev/null | sed 's/^/      /' >&2
          fi
          echo
          echo "  shell for the first user:"
          grep '^okra:' "$MNT/etc/passwd" 2>/dev/null | sed 's/^/    /' || true
          if [ "$mounted" = fuse ]; then
            fusermount -u "$MNT" || fusermount3 -u "$MNT" || true
          else
            sudo umount "$MNT" 2>/dev/null || true
            [ -n "$LOOP" ] && sudo losetup -d "$LOOP" 2>/dev/null || true
          fi
          rmdir "$MNT" 2>/dev/null || true
          echo
          if [ "$fails" -gt 0 ]; then
            echo "FAIL: $fails check(s) did not pass" >&2
            exit 1
          fi
          echo 'PASS: the installed system is finished and ready to log in'
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okra-install-diag
          path: |
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/boot3.log
            ${{ runner.temp }}/driver3.log
            ${{ runner.temp }}/boot.log
            ${{ runner.temp }}/driver.log
            ${{ runner.temp }}/driver2.log
            ${{ runner.temp }}/boot2.log
          if-no-files-found: warn
          retention-days: 14