name: Answer the Initial Setup in QEMU

# Walks through systemd-firstboot.service: timezone, hostname, root password.
#
# Getting here took three tries, and the sources settled the last two points:
#
# - The console accepts either \n or \r. Both break the line in
#   ask_string_full, so the terminator was never the problem.
# - The timezone prompt arrives prefilled with the preselected completion, so
#   the field already holds UTC and an answer sent on top of it reads UTCUTC.
# - Feeding the serial port works; QEMU's sendkey does not, because that
#   drives the PS/2 keyboard while this console is on ttyS0.
#
# So the bytes go to the serial port, each answer starts with Ctrl-U to clear
# the prefilled text, and each question is awaited by its own wording.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long to let it run'
        required: false
        default: '1500'

jobs:
  talk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install what the test needs
        run: |
          set -euo pipefail
          if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            sudo rm -f /etc/apt/apt-mirrors.txt
            {
              echo 'Types: deb'
              echo 'URIs: http://185.125.190.81/ubuntu/'
              echo 'Suites: noble noble-updates noble-backports'
              echo 'Components: main restricted universe multiverse'
              echo 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
            } | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends qemu-system-x86

      - name: Get the ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -m 900 -H "Authorization: token $GH_TOKEN" \
            -o "$RUNNER_TEMP/okra-linux.iso" \
            "https://github.com/ylh440104/okra-pm-bootstrap/releases/download/okra-linux-iso/okra-linux.iso"
          ls -l "$RUNNER_TEMP/okra-linux.iso"

      - name: Boot it and answer the questions
        env:
          SECONDS_TO_RUN: ${{ github.event.inputs.seconds }}
          FIFO: ${{ runner.temp }}/serial.in
          LOG: ${{ runner.temp }}/serial.log
          DRIVER: ${{ runner.temp }}/driver.log
        run: |
          set -uo pipefail
          rm -f "$FIFO" "$LOG" "$DRIVER"
          mkfifo "$FIFO"

          # Two separate writers, because the reader has to be free to look at
          # the log while the fifo is still open: the shell opens the fifo for
          # writing only once, and a single process doing both would block on
          # the open before QEMU ever started.
          driver() {
            sleep 30
            waited=0
            while [ "$waited" -lt 900 ]; do
              grep -q "timezone name or number" "$LOG" 2>/dev/null && break
              sleep 4
              waited=$((waited + 4))
            done
            echo "first prompt after ${waited}s" >&2
            grep -q "timezone name or number" "$LOG" 2>/dev/null || return 1
            sleep 5
            printf "\025"; sleep 1; printf "utc\r"; echo "typed: utc" >&2
            waited=0
            while [ "$waited" -lt 400 ]; do
              grep -q "new hostname" "$LOG" 2>/dev/null && break
              sleep 4
              waited=$((waited + 4))
            done
            echo "hostname prompt after ${waited}s" >&2
            grep -q "new hostname" "$LOG" 2>/dev/null || return 1
            sleep 5
            printf "\025"; sleep 1; printf "okra\r"; echo "typed: okra" >&2
            waited=0
            while [ "$waited" -lt 400 ]; do
              grep -q "new root password" "$LOG" 2>/dev/null && break
              sleep 4
              waited=$((waited + 4))
            done
            echo "password prompt after ${waited}s" >&2
            grep -q "new root password" "$LOG" 2>/dev/null || return 1
            sleep 5
            printf "\025"; sleep 1; printf "okra\r"; echo "typed: okra (password)" >&2
            waited=0
            while [ "$waited" -lt 400 ]; do
              grep -q "root password again" "$LOG" 2>/dev/null && break
              sleep 4
              waited=$((waited + 4))
            done
            echo "repeat prompt after ${waited}s" >&2
            grep -q "root password again" "$LOG" 2>/dev/null || return 1
            sleep 5
            printf "\025"; sleep 1; printf "okra\r"; echo "typed: okra (again)" >&2
            sleep 200
          }
          
          driver > "$FIFO" 2> "$DRIVER" &
          Driver=$!

          timeout "${SECONDS_TO_RUN:-1500}" qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -cdrom "$RUNNER_TEMP/okra-linux.iso" -boot d \
            -display none -serial stdio -no-reboot \
            > "$LOG" 2>&1 || true

          kill "$Driver" 2>/dev/null || true
          rm -f "$FIFO"

      - name: Say what happened
        if: always()
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/serial.log"
          DRIVER="$RUNNER_TEMP/driver.log"
          echo "== what the driver did"
          cat "$DRIVER" 2>/dev/null || echo "  (no driver log)"
          echo
          echo "== from the first prompt on"
          N=$(grep -n 'Please configure the system' "$LOG" 2>/dev/null | head -1 | cut -d: -f1 || true)
          if [ -n "${N:-}" ]; then
            sed -n "$N,\$p" "$LOG" | head -60
          else
            echo "  (the setup banner never appeared)"
            tail -20 "$LOG" 2>/dev/null || true
          fi
          echo
          echo "== how far it got"
          for Mark in 'timezone name or number' 'new hostname' 'new root password' \
                      'root password again' 'Invalid input' 'login'; do
            printf '  %-26s %s\n' "$Mark" "$(grep -c "$Mark" "$LOG" 2>/dev/null || true)"
          done

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okra-setup-serial-log
          path: |
            ${{ runner.temp }}/serial.log
            ${{ runner.temp }}/driver.log
          if-no-files-found: warn
          retention-days: 14