name: Answer the Initial Setup in QEMU

# Walks through systemd-firstboot.service: the timezone, the hostname and the
# root password.
#
# Two rounds of this did nothing at all, and the reason was in the shell
# rather than the console: the send routine lived behind a helper that used
# local inside a subshell under set -u, so the branch that was meant to type
# never ran and the log shows the prompts with no keystrokes after them. The
# body is written out flat here, and every step prints what it saw first, so
# the next log says whether it is the waiting or the typing that fails.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long to let it run'
        required: false
        default: '1500'

jobs:
  talk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install what the test needs
        run: |
          set -euo pipefail
          if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            sudo rm -f /etc/apt/apt-mirrors.txt
            {
              echo 'Types: deb'
              echo 'URIs: http://185.125.190.81/ubuntu/'
              echo 'Suites: noble noble-updates noble-backports'
              echo 'Components: main restricted universe multiverse'
              echo 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
            } | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            qemu-system-x86 socat

      - name: Get the ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -m 900 -H "Authorization: token $GH_TOKEN" \
            -o "$RUNNER_TEMP/okra-linux.iso" \
            "https://github.com/ylh440104/okra-pm-bootstrap/releases/download/okra-linux-iso/okra-linux.iso"
          ls -l "$RUNNER_TEMP/okra-linux.iso"

      - name: Boot it and answer the questions
        env:
          SECONDS_TO_RUN: ${{ github.event.inputs.seconds }}
          MON: ${{ runner.temp }}/monitor.sock
          LOG: ${{ runner.temp }}/serial.log
          DRIVER: ${{ runner.temp }}/driver.log
        run: |
          set -uo pipefail
          rm -f "$MON" "$LOG" "$DRIVER"

          (
            # Give QEMU time to create the monitor socket.
            i=0
            while [ "$i" -lt 120 ]; do
              [ -S "$MON" ] && break
              sleep 2
              i=$((i + 2))
            done
            echo "monitor socket: $([ -S "$MON" ] && echo up || echo missing)"

            key() {
              printf 'sendkey %s\n' "$1" | socat - "UNIX-CONNECT:$MON" 2>/dev/null
              sleep 0.4
            }

            # Ctrl-U empties the field, because the prompt arrives prefilled
            # with the preselected completion.
            answer() {
              echo "typing: $1"
              key ctrl-u
              sleep 0.6
              j=0
              while [ "$j" -lt "${#1}" ]; do
                key "$(printf '%s' "$1" | cut -c$((j + 1)))"
                j=$((j + 1))
              done
              sleep 0.4
              key ret
            }

            # Poll for a line to show up, without local and without a subshell.
            g=0
            while [ "$g" -lt 900 ]; do
              grep -q 'timezone name or number' "$LOG" 2>/dev/null && break
              sleep 5
              g=$((g + 5))
            done
            echo "waited ${g}s for the first prompt"
            if grep -q 'timezone name or number' "$LOG" 2>/dev/null; then
              sleep 6
              answer utc

              g=0
              while [ "$g" -lt 400 ]; do
                grep -q 'new hostname' "$LOG" 2>/dev/null && break
                sleep 5
                g=$((g + 5))
              done
              echo "waited ${g}s for the hostname prompt"
              if grep -q 'new hostname' "$LOG" 2>/dev/null; then
                sleep 6
                answer okra

                g=0
                while [ "$g" -lt 400 ]; do
                  grep -q 'new root password' "$LOG" 2>/dev/null && break
                  sleep 5
                  g=$((g + 5))
                done
                echo "waited ${g}s for the password prompt"
                if grep -q 'new root password' "$LOG" 2>/dev/null; then
                  sleep 6
                  answer okra

                  g=0
                  while [ "$g" -lt 400 ]; do
                    grep -q 'root password again' "$LOG" 2>/dev/null && break
                    sleep 5
                    g=$((g + 5))
                  done
                  echo "waited ${g}s for the repeat"
                  if grep -q 'root password again' "$LOG" 2>/dev/null; then
                    sleep 6
                    answer okra
                  fi
                fi
              fi
            fi
            sleep 300
          ) > "$DRIVER" 2>&1 &

          timeout "${SECONDS_TO_RUN:-1500}" qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -cdrom "$RUNNER_TEMP/okra-linux.iso" -boot d \
            -display none -serial stdio -no-reboot \
            -monitor "unix:$MON,server,nowait" \
            < /dev/null > "$LOG" 2>&1 || true

          echo "== $(wc -l < "$LOG") lines of serial output"
          echo
          echo "== what the driver did"
          cat "$DRIVER" 2>/dev/null || echo "  (no driver log)"
          echo
          echo "== from the first prompt on"
          N=$(grep -n 'Please configure the system' "$LOG" | head -1 | cut -d: -f1 || true)
          if [ -n "${N:-}" ]; then
            sed -n "$N,\$p" "$LOG" | head -70
          else
            tail -40 "$LOG"
          fi

      - name: Say what happened
        if: always()
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/serial.log"
          [ -f "$LOG" ] || { echo "no serial log was produced"; exit 0; }
          echo "== how far the setup got"
          for Mark in 'timezone name or number' 'new hostname' 'new root password' \
                      'root password again' 'Invalid input' 'Completed' 'login'; do
            printf '  %-26s %s\n' "$Mark" "$(grep -c "$Mark" "$LOG" 2>/dev/null || true)"
          done

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okra-setup-serial-log
          path: |
            ${{ runner.temp }}/serial.log
            ${{ runner.temp }}/driver.log
          if-no-files-found: warn
          retention-days: 14