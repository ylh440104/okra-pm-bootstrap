name: Answer the Initial Setup in QEMU

# Walks through the first boot configuration. The setup is
# systemd-firstboot.service and it reads from the console. Feeding the serial
# port bytes did not work: neither a newline nor a carriage return ended the
# line, and the answers piled up as UTCUTC and UTCokra. This drives the
# keyboard through the monitor instead, so Enter is a real Enter.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'How long to let it run'
        required: false
        default: '1500'

jobs:
  talk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install what the test needs
        run: |
          set -euo pipefail
          if ! getent hosts archive.ubuntu.com >/dev/null 2>&1; then
            sudo rm -f /etc/apt/apt-mirrors.txt
            {
              echo 'Types: deb'
              echo 'URIs: http://185.125.190.81/ubuntu/'
              echo 'Suites: noble noble-updates noble-backports'
              echo 'Components: main restricted universe multiverse'
              echo 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
            } | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            qemu-system-x86 socat

      - name: Get the ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -m 900 -H "Authorization: token $GH_TOKEN" \
            -o "$RUNNER_TEMP/okra-linux.iso" \
            "https://github.com/ylh440104/okra-pm-bootstrap/releases/download/okra-linux-iso/okra-linux.iso"
          ls -l "$RUNNER_TEMP/okra-linux.iso"

      - name: Boot it and answer the questions
        env:
          SECONDS_TO_RUN: ${{ github.event.inputs.seconds }}
        run: |
          set -uo pipefail
          MON="$RUNNER_TEMP/monitor.sock"
          LOG="$RUNNER_TEMP/serial.log"
          rm -f "$MON" "$LOG"

          send() {
            for Key in "$@"; do
              printf 'sendkey %s\n' "$Key" | socat - "UNIX-CONNECT:$MON" >/dev/null 2>&1
              sleep 0.5
            done
          }

          await() {
            local Pattern="$1" Limit="$2" Want="${3:-1}"
            local Waited=0 Have=0
            while [ "$Waited" -lt "$Limit" ]; do
              Have=$(grep -c "$Pattern" "$LOG" 2>/dev/null || true)
              [ "${Have:-0}" -ge "$Want" ] && return 0
              sleep 5
              Waited=$((Waited + 5))
            done
            return 1
          }

          wait_for_qemu() {
            local Waited=0
            while [ "$Waited" -lt 150 ]; do
              [ -S "$MON" ] && return 0
              sleep 2
              Waited=$((Waited + 2))
            done
            return 1
          }

          (
            wait_for_qemu || exit 1
            if await 'Please configure the system' 900; then
              sleep 8
              echo "== answering the timezone"
              send u t c ret
              if await 'hostname' 400; then
                sleep 8
                echo "== answering the hostname"
                send o k r a ret
                if await 'root password' 400; then
                  sleep 8
                  echo "== answering the password"
                  send o k r a ret
                  if await 'root password' 400 2; then
                    sleep 8
                    echo "== answering the password again"
                    send o k r a ret
                  fi
                fi
              fi
            fi
          ) &

          timeout "${SECONDS_TO_RUN:-1500}" qemu-system-x86_64 \
            -m 2048 -smp 2 -accel tcg \
            -cdrom "$RUNNER_TEMP/okra-linux.iso" -boot d \
            -display none -serial stdio -no-reboot \
            -monitor "unix:$MON,server,nowait" \
            < /dev/null > "$LOG" 2>&1 || true

          echo "== $(wc -l < "$LOG") lines of serial output"
          echo
          echo "== from the first prompt on"
          N=$(grep -n 'Please configure the system' "$LOG" | head -1 | cut -d: -f1 || true)
          if [ -n "${N:-}" ]; then
            sed -n "$N,\$p" "$LOG" | head -60
          else
            tail -40 "$LOG"
          fi

      - name: Say what happened
        if: always()
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/serial.log"
          [ -f "$LOG" ] || { echo "no serial log was produced"; exit 0; }
          echo "== how far the setup got"
          for Mark in 'Please configure' 'new timezone' 'hostname' 'root password' 'complete' 'login'; do
            printf '  %-24s %s\n' "$Mark" "$(grep -c "$Mark" "$LOG" 2>/dev/null || true)"
          done
          echo
          echo "== the tail"
          tail -25 "$LOG" || true

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okra-setup-serial-log
          path: ${{ runner.temp }}/serial.log
          if-no-files-found: warn
          retention-days: 14